<!doctype html><html lang="tr"><meta charset="utf-8"><title>Kalemio · Deneme alanları</title>
<style>body{max-width:680px;margin:40px auto;font:16px/1.5 system-ui;color:#183e31}label,textarea,input{display:block;margin:8px 0}textarea,[contenteditable]{width:95%;min-height:64px;border:1px solid #789885;padding:12px}form{margin-top:24px}</style>
<h1>Kalemio deneme alanları</h1><label>Düz metin<textarea id="plain"></textarea></label><label>Kısa metin<input type="text" id="short"></label>
<h2>Zengin metin</h2><div id="rich" contenteditable="true" role="textbox" aria-label="E-posta gövdesi"><b>Merhaba</b> dünya</div>
<label>Parola<input id="password" type="password"></label><label>Doğrulama kodu<input id="otp" autocomplete="one-time-code"></label>
<form><label>Kart numarası<input id="card" autocomplete="cc-number"></label><label>Açıklama<input id="billing-note"></label></form>
</html>
